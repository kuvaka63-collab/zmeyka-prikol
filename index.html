<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Змейка</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; background: #1a1a2e; color: #eee;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; overflow: hidden;
    touch-action: none;
  }
  h1 { font-size: 18px; margin: 8px 0; color: #ff6b9d; letter-spacing: 2px; }
  #score { font-size: 22px; margin: 4px 0 8px; font-weight: bold; }
  canvas { background: #16213e; border-radius: 12px; box-shadow: 0 0 30px #0008; }
  #overlay {
    position: fixed; inset: 0; background: #000c; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; z-index: 10;
  }
  .hidden { display: none !important; }
  h2 { font-size: 26px; margin: 0 0 10px; }
  p { margin: 6px 0; color: #bbb; font-size: 15px; }
  button {
    margin-top: 18px; font-size: 20px; padding: 14px 36px;
    border: none; border-radius: 12px; background: #ff6b9d; color: #fff;
    font-weight: bold; cursor: pointer;
  }
  #screamer {
    position: fixed; inset: 0; background: #000; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #screamer.hidden { display: none !important; }
  @keyframes scream {
    0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    10% { transform: scale(1.2) rotate(5deg); opacity: 1; }
    20% { transform: scale(1.1) rotate(-5deg); }
    30% { transform: scale(1.3) rotate(5deg); }
    40% { transform: scale(1.2) rotate(-5deg); }
    50% { transform: scale(1.4) rotate(5deg); }
    60% { transform: scale(1.3) rotate(-5deg); }
    70% { transform: scale(1.5) rotate(5deg); }
    100% { transform: scale(1.5) rotate(0deg); opacity: 1; }
  }
  #screamer img, #screamer canvas {
    width: 100vw; height: 100vh; object-fit: cover;
    animation: scream 0.5s forwards;
  }
  @keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -2px) rotate(-1deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    30% { transform: translate(3px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 2px) rotate(-1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    70% { transform: translate(3px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(1px, 2px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }
  .shaking { animation: shake 0.2s infinite; background: #ff0000 !important; }
</style>
</head>
<body>

<h1>ЗМЕЙКА</h1>
<div id="score">Очки: 0</div>
<canvas id="game"></canvas>

<div id="overlay">
  <h2>Змейка</h2>
  <p>Свайпай по экрану</p>
  <p>Стены и хвост проходимы!</p>
  <p style="color:#ff6b9d; font-size:12px; margin-top:10px;">Внимание: после 10 очков сюрприз!</p>
  <button id="startBtn">Играть</button>
</div>

<div id="screamer" class="hidden">
  <canvas id="scareFace" width="800" height="800"></canvas>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const screamerEl = document.getElementById('screamer');
const scareFace = document.getElementById('scareFace');

let audioCtx = null;
let musicInterval = null;
let snake, dir, nextDir, food, score, running;
let particles = [];
let prizeShown = false;

const COLS = 15;
const ROWS = 15;
let CELL = 0;
const MOVE_INTERVAL = 140;
let lastMoveTime = 0;
let lastTime = 0;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function startMusic() {
  if (!audioCtx || musicInterval) return;
  const bpm = 140;
  const stepTime = 60 / bpm / 4; 
  let step = 0;
  const bassNotes = [55, 55, 55, 65, 55, 55, 73, 55];
  const leadNotes = [440, 523, 659, 880, 659, 523, 440, 330];

  musicInterval = setInterval(() => {
    if (!audioCtx || audioCtx.state === 'suspended') return;
    const t = audioCtx.currentTime;

    if (step % 2 === 0) {
      const noteFreq = bassNotes[Math.floor(step / 4) % bassNotes.length];
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(noteFreq, t);
      const lfo = audioCtx.createOscillator(); const lfoGain = audioCtx.createGain();
      lfo.type = 'sine'; lfo.frequency.setValueAtTime(8, t); lfoGain.gain.setValueAtTime(400, t); 
      lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
      lfo.start(t); lfo.stop(t + stepTime * 2);
      filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, t); filter.Q.setValueAtTime(10, t);
      gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + stepTime * 1.8);
      osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + stepTime * 2);
    }

    if (step % 8 === 0 || step % 8 === 4) {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
      gain.gain.setValueAtTime(1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.15);
    }

    if (step % 2 === 0) {
      const bufferSize = audioCtx.sampleRate * 0.05;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 7000;
      const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(t);
    }

    if (step % 4 === 0 || step % 4 === 3) {
      const noteFreq = leadNotes[Math.floor(step / 2) % leadNotes.length];
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(noteFreq, t);
      gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.1);
    }
    step = (step + 1) % 32;
  }, stepTime * 1000);
}

function stopMusic() { if (musicInterval) { clearInterval(musicInterval); musicInterval = null; } }

function playEatSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(80, t + 0.1);
  gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.15);

  const bufferSize = audioCtx.sampleRate * 0.1;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, t); filter.frequency.exponentialRampToValueAtTime(200, t + 0.1);
  const noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(0.3, t); noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
  noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination); noise.start(t); noise.stop(t + 0.1);
}
function resize() {
  const maxW = Math.min(window.innerWidth - 24, 500);
  const maxH = window.innerHeight - 160;
  const size = Math.min(maxW, maxH);
  CELL = Math.floor(size / COLS);
  canvas.width = CELL * COLS;
  canvas.height = CELL * ROWS;
}

function reset() {
  snake = [{x: 8, y: 7}, {x: 7, y: 7}, {x: 6, y: 7}, {x: 5, y: 7}, {x: 4, y: 7}, {x: 3, y: 7}, {x: 2, y: 7}];
  dir = {x: 1, y: 0}; nextDir = {x: 1, y: 0};
  score = 0; particles = []; prizeShown = false;
  scoreEl.textContent = 'Очки: 0';
  placeFood();
}

function placeFood() {
  while (true) {
    const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; break; }
  }
}

const SKIN = '#d9a07a', SKIN_DARK = '#a97052', SKIN_LIGHT = '#f0c4a1';
const HEAD = '#e0a888', HEAD_DARK = '#a86d52', HEAD_LIGHT = '#f5cdb2';

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#ffffff08'; ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
  }
  if (food) drawBoobs(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL);
  if (snake) drawSnake();
  drawParticles();
}

function drawBoobs(cx, cy, size) {
  const r = size * 0.22, offset = size * 0.18;
  [cx - offset, cx + offset].forEach(x => {
    const g = ctx.createRadialGradient(x - r * 0.3, cy - r * 0.3, r * 0.1, x, cy, r);
    g.addColorStop(0, '#f5c9b0'); g.addColorStop(0.6, '#e0a888'); g.addColorStop(1, '#b97d60');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c96b6b'; ctx.beginPath(); ctx.arc(x, cy, r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff35'; ctx.beginPath(); ctx.arc(x - r * 0.35, cy - r * 0.35, r * 0.3, 0, Math.PI * 2); ctx.fill();
  });
}

function spawnCum() {
  const h = snake[0], hx = h.x * CELL + CELL / 2, hy = h.y * CELL + CELL / 2;
  const angle = Math.atan2(dir.y, dir.x);
  const sx = hx + Math.cos(angle) * CELL * 0.45, sy = hy + Math.sin(angle) * CELL * 0.45;
  for (let i = 0; i < 18; i++) {
    const a = angle + (Math.random() - 0.5) * 1.1;
    const speed = CELL * (4 + Math.random() * 5);
    particles.push({ x: sx, y: sy, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 1, decay: 0.015 + Math.random() * 0.02, size: CELL * (0.08 + Math.random() * 0.1) });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += CELL * 8 * dt; p.vx *= 0.98; p.vy *= 0.98;
    p.life -= p.decay * (dt * 60);
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life);
    ctx.fillStyle = `rgba(255, 250, 240, ${alpha})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.6 + p.life * 0.4), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
    ctx.beginPath(); ctx.arc(p.x - p.size * 0.2, p.y - p.size * 0.2, p.size * 0.3, 0, Math.PI * 2); ctx.fill();
  }
}

function wrap(p) { return { x: (p.x + COLS) % COLS, y: (p.y + ROWS) % ROWS }; }

function drawSnake() {
  const n = snake.length; if (n === 0) return;
  const pts = snake.map(s => ({ x: s.x * CELL + CELL / 2, y: s.y * CELL + CELL / 2 }));
  const bodyWidth = CELL * 0.8;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = SKIN_DARK; ctx.lineWidth = bodyWidth + CELL * 0.08; drawPath(pts); ctx.stroke();
  const bodyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bodyGrad.addColorStop(0, SKIN_LIGHT); bodyGrad.addColorStop(0.5, SKIN); bodyGrad.addColorStop(1, SKIN_DARK);
  ctx.strokeStyle = bodyGrad; ctx.lineWidth = bodyWidth; drawPath(pts); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = bodyWidth * 0.3;
  ctx.save(); ctx.translate(0, -bodyWidth * 0.2); drawPath(pts); ctx.stroke(); ctx.restore();

  const h = snake[0], hx = h.x * CELL + CELL / 2, hy = h.y * CELL + CELL / 2;
  const angle = Math.atan2(dir.y, dir.x);
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(angle);
  const hg = ctx.createRadialGradient(-CELL * 0.1, -CELL * 0.15, CELL * 0.05, 0, 0, CELL * 0.55);
  hg.addColorStop(0, HEAD_LIGHT); hg.addColorStop(0.6, HEAD); hg.addColorStop(1, HEAD_DARK);
  ctx.fillStyle = hg; ctx.beginPath(); ctx.ellipse(CELL * 0.05, 0, CELL * 0.52, CELL * 0.46, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(140, 80, 55, 0.75)'; ctx.lineWidth = Math.max(2, CELL * 0.09);
  ctx.beginPath(); ctx.moveTo(-CELL * 0.18, -CELL * 0.46); ctx.quadraticCurveTo(-CELL * 0.12, 0, -CELL * 0.18, CELL * 0.46); ctx.stroke();
  ctx.fillStyle = 'rgba(110, 60, 45, 0.9)'; ctx.beginPath(); ctx.ellipse(CELL * 0.38, 0, CELL * 0.05, CELL * 0.07, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff45'; ctx.beginPath(); ctx.ellipse(-CELL * 0.02, -CELL * 0.18, CELL * 0.2, CELL * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (n >= 2) {
    const tail = snake[n - 1], tx = tail.x * CELL + CELL / 2, ty = tail.y * CELL + CELL / 2;
    const prev = snake[n - 2];
    const vx = tail.x - prev.x, vy = tail.y - prev.y;
    const len = Math.hypot(vx, vy) || 1;
    const nx = -vy / len, ny = vx / len;
    const d = CELL * 0.3, r = CELL * 0.34;
    [ [tx + nx * d, ty + ny * d], [tx - nx * d, ty - ny * d] ].forEach(([bx, by]) => {
      const g = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.3, r * 0.1, bx, by, r);
      g.addColorStop(0, SKIN_LIGHT); g.addColorStop(0.6, SKIN_DARK); g.addColorStop(1, '#8a5d45');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff35'; ctx.beginPath(); ctx.arc(bx - r * 0.35, by - r * 0.35, r * 0.28, 0, Math.PI * 2); ctx.fill();
    });
  }
}

function drawPath(pts) {
  ctx.beginPath(); if (pts.length === 0) return;
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const prev = pts[i - 1], cur = pts[i];
    if (Math.abs(cur.x - prev.x) > CELL * 1.5 || Math.abs(cur.y - prev.y) > CELL * 1.5) { ctx.moveTo(cur.x, cur.y); } 
    else { ctx.lineTo(cur.x, cur.y); }
  }
}

function gameLoop(time) {
  if (!lastTime) lastTime = time;
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;
  if (running) {
    if (time - lastMoveTime > MOVE_INTERVAL) { step(); lastMoveTime = time; }
    if (particles.length > 0) updateParticles(dt);
    draw();
  }
  requestAnimationFrame(gameLoop);
}

function step() {
  dir = nextDir;
  const rawHead = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const head = wrap(rawHead);
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++; scoreEl.textContent = 'Очки: ' + score;
    playEatSound(); spawnCum(); placeFood();
    if (score === 10 && !prizeShown) { prizeShown = true; triggerScreamer(); }
  } else { snake.pop(); }
}

function playScarySound() {
  if (!audioCtx) return; const t = audioCtx.currentTime;
  const osc1 = audioCtx.createOscillator(); const gain1 = audioCtx.createGain();
  osc1.type = 'sawtooth'; osc1.frequency.setValueAtTime(800, t); osc1.frequency.exponentialRampToValueAtTime(100, t + 2);
  gain1.gain.setValueAtTime(1, t); osc1.connect(gain1); gain1.connect(audioCtx.destination); osc1.start(t); osc1.stop(t + 2);
  const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
  osc2.type = 'square'; osc2.frequency.setValueAtTime(50, t); osc2.frequency.linearRampToValueAtTime(30, t + 2);
  gain2.gain.setValueAtTime(0.8, t); osc2.connect(gain2); gain2.connect(audioCtx.destination); osc2.start(t); osc2.stop(t + 2);
  const bufferSize = audioCtx.sampleRate * 2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
  const gain3 = audioCtx.createGain(); gain3.gain.setValueAtTime(0.5, t); gain3.gain.exponentialRampToValueAtTime(0.01, t + 2);
  noise.connect(gain3); gain3.connect(audioCtx.destination); noise.start(t); noise.stop(t + 2);
}

function drawScaryFace() {
  const c = scareFace.getContext('2d'); const W = scareFace.width, H = scareFace.height;
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#800'; c.beginPath(); c.moveTo(0, 0); c.lineTo(W, 0); c.lineTo(W, H*0.3);
  for(let i=W; i>0; i-=20) c.lineTo(i, H*0.3 + Math.random()*100);
  c.fill();
  const cx = W / 2, cy = H / 2;
  c.fillStyle = '#d4d4d4'; c.beginPath(); c.ellipse(cx, cy, W*0.4, H*0.45, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#555'; c.beginPath(); c.ellipse(cx - W*0.15, cy - H*0.05, W*0.12, H*0.15, 0, 0, Math.PI*2); c.fill(); c.beginPath(); c.ellipse(cx + W*0.15, cy - H*0.05, W*0.12, H*0.15, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#000'; c.beginPath(); c.ellipse(cx - W*0.15, cy - H*0.05, W*0.08, H*0.1, 0, 0, Math.PI*2); c.fill(); c.beginPath(); c.ellipse(cx + W*0.15, cy - H*0.05, W*0.08, H*0.1, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#f00'; c.beginPath(); c.arc(cx - W*0.15, cy - H*0.05, W*0.02, 0, Math.PI*2); c.fill(); c.beginPath(); c.arc(cx + W*0.15, cy - H*0.05, W*0.02, 0, Math.PI*2); c.fill();
  c.fillStyle = '#000'; c.beginPath(); c.ellipse(cx, cy + H*0.2, W*0.15, H*0.25, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#fff';
  c.beginPath(); c.moveTo(cx - W*0.1, cy + H*0.05); c.lineTo(cx - W*0.05, cy + H*0.15); c.lineTo(cx, cy + H*0.05); c.lineTo(cx + W*0.05, cy + H*0.15); c.lineTo(cx + W*0.1, cy + H*0.05); c.fill();
  c.beginPath(); c.moveTo(cx - W*0.1, cy + H*0.35); c.lineTo(cx - W*0.05, cy + H*0.25); c.lineTo(cx, cy + H*0.35); c.lineTo(cx + W*0.05, cy + H*0.25); c.lineTo(cx + W*0.1, cy + H*0.35); c.fill();
  c.fillStyle = '#800'; c.beginPath(); c.moveTo(cx - W*0.15, cy - H*0.05); c.lineTo(cx - W*0.17, cy + H*0.2); c.lineTo(cx - W*0.13, cy + H*0.2); c.fill(); c.beginPath(); c.moveTo(cx + W*0.15, cy - H*0.05); c.lineTo(cx + W*0.13, cy + H*0.2); c.lineTo(cx + W*0.17, cy + H*0.2); c.fill();
}

function triggerScreamer() {
  running = false; stopMusic(); 
  if (navigator.vibrate) navigator.vibrate([500, 100, 500, 100, 1000]);
  playScarySound(); drawScaryFace();
  screamerEl.classList.remove('hidden');
  document.body.classList.add('shaking');
  
  setTimeout(() => {
    screamerEl.classList.add('hidden');
    document.body.classList.remove('shaking');
    overlay.classList.remove('hidden');
    overlay.innerHTML = `<h2>Ты попался...</h2><p>Очки: ${score}</p><button id="startBtn">Ещё раз</button>`;
    const newBtn = document.getElementById('startBtn');
    if (newBtn) newBtn.addEventListener('click', start);
  }, 2500);
}

function start() {
  initAudio();
  overlay.classList.add('hidden');
  screamerEl.classList.add('hidden');
  reset();
  running = true;
  lastMoveTime = performance.now();
  lastTime = performance.now();
  startMusic(); 
  requestAnimationFrame(gameLoop);
}

document.getElementById('startBtn').addEventListener('click', start);

let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  if (!touchStart || !running) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', e => { touchStart = null; e.preventDefault(); }, { passive: false });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') setDir(0, -1);
  else if (e.key === 'ArrowDown' || e.key === 's') setDir(0, 1);
  else if (e.key === 'ArrowLeft' || e.key === 'a') setDir(-1, 0);
  else if (e.key === 'ArrowRight' || e.key === 'd') setDir(1, 0);
});

function setDir(nx, ny) { if (nx === -dir.x && ny === -dir.y) return; nextDir = { x: nx, y: ny }; }

window.addEventListener('resize', () => { resize(); if(running) draw(); });

resize();
reset();
draw();
</script>
</body>
</html>
